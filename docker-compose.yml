services:
  postgres:
    image: postgres:16-alpine
    container_name: chain-stories-postgres
    environment:
      POSTGRES_DB: chain_stories
      POSTGRES_USER: chain_stories
      POSTGRES_PASSWORD: chain_stories_dev
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chain_stories -d chain_stories"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chain-stories-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles:
      - app
    build:
      context: ./backend
    container_name: chain-stories-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chain_stories
      SPRING_DATASOURCE_USERNAME: chain_stories
      SPRING_DATASOURCE_PASSWORD: chain_stories_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_ISSUER: ${JWT_ISSUER:-chain-stories-local}
      JWT_SECRET: ${JWT_SECRET:-replace-with-local-development-secret}
      JWT_ALLOW_INSECURE_DEV_SECRET: ${JWT_ALLOW_INSECURE_DEV_SECRET:-true}
      SUBSCRIPTIONS_MOCK_PURCHASES_ENABLED: ${SUBSCRIPTIONS_MOCK_PURCHASES_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
