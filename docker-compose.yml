services:
  postgres:
    image: postgres:16-alpine
    container_name: chain-stories-postgres
    environment:
      POSTGRES_DB: chain_stories
      POSTGRES_USER: chain_stories
      POSTGRES_PASSWORD: chain_stories_dev
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chain_stories -d chain_stories"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chain-stories-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
