name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chain_stories
          POSTGRES_USER: chain_stories
          POSTGRES_PASSWORD: chain_stories_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chain_stories -d chain_stories"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/chain_stories
        run: mvn test

  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Compose app profile
        run: docker compose --profile app config
      - name: Build backend image
        run: docker build --file backend/Dockerfile backend
      - name: Validate load-test script syntax
        run: node --check tools/load/k6-room-game.mjs

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Test mobile contracts
        working-directory: mobile
        run: npm run test:unit
