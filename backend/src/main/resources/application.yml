spring:
  application:
    name: chain-stories-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/chain_stories}
    username: ${SPRING_DATASOURCE_USERNAME:chain_stories}
    password: ${SPRING_DATASOURCE_PASSWORD:chain_stories_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:chain-stories-local}
      secret: ${JWT_SECRET:replace-with-local-development-secret}
      allow-insecure-dev-secret: ${JWT_ALLOW_INSECURE_DEV_SECRET:true}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
      password-reset-token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
  subscriptions:
    mock-purchases-enabled: ${SUBSCRIPTIONS_MOCK_PURCHASES_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.chainreaction: DEBUG
